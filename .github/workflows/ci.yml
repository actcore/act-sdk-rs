name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: moonrepo/setup-rust@v1
        with:
          targets: wasm32-wasip2
          components: clippy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check (wasm32-wasip2)
        run: cargo check --target wasm32-wasip2 --workspace --exclude hello-world --exclude http-client --exclude counter
      - name: Check examples (wasm32-wasip2)
        run: cargo check --target wasm32-wasip2 -p hello-sdk -p config-sdk -p http-client-sdk
      - name: Clippy (host)
        run: cargo clippy --target x86_64-unknown-linux-gnu -p act-types -p act-sdk-macros -p act-sdk -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: moonrepo/setup-rust@v1
        with:
          targets: wasm32-wasip2
          bins: cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test act-types
        run: cargo nextest run --no-tests=pass --target x86_64-unknown-linux-gnu -p act-types
      - name: Test act-sdk-macros
        run: cargo nextest run --no-tests=pass --target x86_64-unknown-linux-gnu -p act-sdk-macros
      - name: Test act-sdk
        run: cargo nextest run --no-tests=pass --target x86_64-unknown-linux-gnu -p act-sdk

  build:
    name: Build components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: moonrepo/setup-rust@v1
        with:
          targets: wasm32-wasip2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build all (wasm32-wasip2)
        run: cargo build --target wasm32-wasip2 --workspace --release

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          components: rustfmt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --all -- --check

  forbidden:
    name: Crates std has replaced
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # `cfg-if` and `assert_matches` are refused — `std::cfg_select!` and
      # `std::assert_matches!` replace them and have been stable since 1.96.
      # No toolchain: the check reads our manifests, not the lockfile.
      - run: python3 scripts/forbidden-crates.py
